[project]
name = "langchain-in-action"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbirDas", email = "das.abirkumar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.1",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langchain-in-action = "langchain_in_action:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
